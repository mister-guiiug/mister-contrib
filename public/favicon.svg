<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Mister Contrib">
  <!--
    LA MARQUE : un calendrier de contributions réduit à neuf jours. Les cases
    vives montent en diagonale, d'en bas à gauche vers en haut à droite. La
    grille reste lisible à 16 px (trois points clairs en biais). Ce fichier est
    servi tel quel par l'en-tête de la page, il fait le favicon, et
    `npm run icons` en tire les six PNG du manifeste plus l'icône maskable.

    LA TUILE ET LE FOND DU MASKABLE VONT PAR PAIRE. Le maskable est fabriqué
    en réduisant cette image à 87,5 % puis en comblant le pourtour d'une
    couleur unie : l'option « bg » du script `icons`, dans `package.json`.
    Elle doit valoir la teinte EXACTE du rectangle ci-dessous, ici
    59,110,165 pour #3b6ea5. Sans cet accord, le générateur comble avec son
    défaut (12,18,34) et l'icône installée porte un CADRE bleu nuit autour de
    la tuile.

    En changeant la tuile, changer les deux : le `fill` du rectangle, et les
    trois nombres de l'option. Puis `npm run icons`, et regarder
    `icon-maskable.png` : le pourtour ne doit pas se voir.

    (Et l'option ne peut pas s'écrire ici avec ses deux tirets : XML interdit
    le double tiret dans un commentaire, et le rasteriseur refuse le fichier.)

    LA TUILE RESTE UNIE, sans dégradé : un dégradé rendrait ce raccord
    impossible.
  -->
  <rect width="64" height="64" rx="14" fill="#3b6ea5" />
  <g fill="#ffffff">
    <rect x="11.5" y="11.5" width="11" height="11" rx="2.5" fill-opacity="0.3" />
    <rect x="26.5" y="11.5" width="11" height="11" rx="2.5" fill-opacity="0.55" />
    <rect x="41.5" y="11.5" width="11" height="11" rx="2.5" />
    <rect x="11.5" y="26.5" width="11" height="11" rx="2.5" fill-opacity="0.55" />
    <rect x="26.5" y="26.5" width="11" height="11" rx="2.5" />
    <rect x="41.5" y="26.5" width="11" height="11" rx="2.5" fill-opacity="0.55" />
    <rect x="11.5" y="41.5" width="11" height="11" rx="2.5" />
    <rect x="26.5" y="41.5" width="11" height="11" rx="2.5" fill-opacity="0.55" />
    <rect x="41.5" y="41.5" width="11" height="11" rx="2.5" fill-opacity="0.3" />
  </g>
</svg>
