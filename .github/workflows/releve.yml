# Relevé multi-forges → public/donnees.json (anonymisé), puis commit sur main.
# Le déploiement Pages existant (deploy.yml) republie l'app avec l'instantané.
name: Relevé

on:
  schedule:
    # Une fois par jour à :17 UTC — les quotas multi-forges ne justifient pas
    # l'horaire. workflow_dispatch pour forcer après avoir posé SOURCES_JSON.
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/releve.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: releve-contrib
  cancel-in-progress: false

jobs:
  relever:
    name: Relever les contributions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Fusion et écriture de donnees.json
        env:
          SOURCES_JSON: ${{ secrets.SOURCES_JSON }}
        run: node scripts/releve.mjs

      - name: Commiter l'instantané s'il a changé
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/donnees.json
          if git diff --staged --quiet; then
            echo "Pas de changement dans donnees.json"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(releve): instantane des contributions au $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Un push avec GITHUB_TOKEN ne déclenche PAS deploy.yml : Pages resterait
      # sur l’ancien donnees.json. On force le workflow Deploy explicitement.
      - name: Republier Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
